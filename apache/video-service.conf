# Apache VirtualHost for the video web service (Flask app via mod_wsgi in daemon mode).

ServerName localhost

<VirtualHost *:80>
    # Hard cap for request bodies. Set above the app limit (500 MB), so that Flask, not
    # Apache, rejects 500-600 MB uploads with its JSON 413.
    LimitRequestBody 629145600

    # The app runs in its own processes as www-data; DB_* come from the container environment.
    WSGIDaemonProcess video-service user=www-data group=www-data \
        processes=2 threads=15 python-path=/app home=/app \
        request-timeout=600 socket-timeout=600 \
        display-name=%{GROUP}
    WSGIProcessGroup video-service
    WSGIApplicationGroup %{GLOBAL}
    WSGIPassAuthorization On

    # Video files are served by Apache directly from the uploads volume (Range, ETag,
    # sendfile). Must come before WSGIScriptAlias /, which takes everything else.
    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Require all granted
        Options -Indexes
        AllowOverride None
        # Unfinished uploads (*.part) are never served.
        <FilesMatch "\.part$">
            Require all denied
        </FilesMatch>
    </Directory>

    # process-group + application-group load the app when Apache starts, not on the
    # first request.
    WSGIScriptAlias / /app/web_service.wsgi process-group=video-service application-group=%{GLOBAL}
    <Directory /app>
        <Files web_service.wsgi>
            Require all granted
        </Files>
    </Directory>

    # Logs go to the container's stdout/stderr (docker compose logs web).
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
